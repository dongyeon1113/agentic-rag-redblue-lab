[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-system"
version = "0.1.0"
description = "Single-orchestrator, multi-tool-service agent skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "uvicorn>=0.35,<1",
    "chromadb==1.5.9",
]

[project.scripts]
agent-cli = "agent_system.cli:main"

[project.optional-dependencies]
defense = [
    "transformers>=4.51,<5",
    "torch==2.6.0",
]

dev = [
    "pytest>=8.4,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gui = ["static/*.html", "*.json"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

