# Run the application stack against an Ollama server hosted outside this
# machine (for example, on a Google Compute Engine GPU VM).
#
# Usage:
#   REMOTE_OLLAMA_BASE_URL=http://100.64.0.10:11434 \
#     docker compose -f compose.yaml -f compose.remote-ollama.yaml up -d --build

services:
  # Profiles are deliberately not enabled by the remote-mode command, keeping
  # local GPU containers out of `docker compose up` while preserving the base
  # compose file for normal local-GPU use.
  ollama:
    profiles: [local-ollama-disabled]

  ollama-model-init:
    profiles: [local-ollama-disabled]

  ollama-llama32-3b-init:
    profiles: [local-ollama-disabled]

  ollama-llama32-1b-init:
    profiles: [local-ollama-disabled]

  ollama-embedding-model-init:
    profiles: [local-ollama-disabled]

  orchestrator:
    runtime: runc
    environment:
      OLLAMA_BASE_URL: ${REMOTE_OLLAMA_BASE_URL:?Set REMOTE_OLLAMA_BASE_URL to the private URL of the remote Ollama server}
      PROMPT_GUARD_DEVICE: ${REMOTE_PROMPT_GUARD_DEVICE:-cpu}
    depends_on: !override
      agent-memory-init:
        condition: service_completed_successfully
      result-init:
        condition: service_completed_successfully
      mock-data-init:
        condition: service_completed_successfully
      gmail-dummy-init:
        condition: service_completed_successfully
      local-db-agent:
        condition: service_healthy
      gmail-agent:
        condition: service_healthy
      drive-agent:
        condition: service_healthy
    deploy: !reset {}

  local-db-agent:
    environment:
      OLLAMA_EMBEDDING_BASE_URL: ${REMOTE_OLLAMA_BASE_URL:?Set REMOTE_OLLAMA_BASE_URL to the private URL of the remote Ollama server}
    depends_on: !reset {}
