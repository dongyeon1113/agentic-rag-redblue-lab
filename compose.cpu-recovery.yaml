services:
  # Keep the wedged GPU-backed services out of the default recovery profile.
  ollama:
    profiles: ["gpu"]

  ollama-model-init:
    profiles: ["gpu"]

  ollama-llama32-3b-init:
    profiles: ["gpu"]

  ollama-llama32-1b-init:
    profiles: ["gpu"]

  ollama-embedding-model-init:
    profiles: ["gpu"]

  ollama-cpu:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    runtime: runc
    init: true
    restart: unless-stopped
    security_opt:
      - apparmor=unconfined
    networks:
      - agent-network
    ports:
      - "${HOST_BIND:-127.0.0.1}:${OLLAMA_CPU_PORT:-19005}:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      OLLAMA_LLM_LIBRARY: cpu_avx2
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  local-db-agent:
    environment:
      OLLAMA_EMBEDDING_BASE_URL: http://ollama-cpu:11434
    depends_on: !override
      ollama-cpu:
        condition: service_healthy

  orchestrator:
    runtime: runc
    environment:
      OLLAMA_BASE_URL: http://ollama-cpu:11434
      OLLAMA_MODEL: ${OLLAMA_CPU_MODEL:-qwen3:8b}
      OLLAMA_NUM_PREDICT: ${OLLAMA_CPU_NUM_PREDICT:-192}
      PROMPT_GUARD_DEVICE: cpu
    deploy:
      resources:
        reservations:
          devices: !reset []
    depends_on: !override
      agent-memory-init:
        condition: service_completed_successfully
      result-init:
        condition: service_completed_successfully
      mock-data-init:
        condition: service_completed_successfully
      gmail-dummy-init:
        condition: service_completed_successfully
      ollama-cpu:
        condition: service_healthy
      local-db-agent:
        condition: service_healthy
      gmail-agent:
        condition: service_healthy
      drive-agent:
        condition: service_healthy
