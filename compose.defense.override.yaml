services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.defense
    environment:
      PROMPT_GUARD_ENABLED: ${PROMPT_GUARD_ENABLED:-true}
      PROMPT_GUARD_MODEL: ${PROMPT_GUARD_MODEL:-meta-llama/Prompt-Guard-86M}
      PROMPT_GUARD_DEVICE: ${PROMPT_GUARD_DEVICE:-cpu}
      PROMPT_GUARD_THRESHOLD: ${PROMPT_GUARD_THRESHOLD:-0.9}
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - ./data/orchestrator:/app/data/orchestrator
      - huggingface-models:/app/.cache/huggingface

volumes:
  huggingface-models:
