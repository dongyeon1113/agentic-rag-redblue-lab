# Work around the Snap Docker AppArmor signal-denial bug on affected hosts.
# Standard Docker installations should use compose.yaml without this override.
services:
  ollama:
    security_opt:
      - apparmor=unconfined

  ollama-model-init:
    security_opt:
      - apparmor=unconfined

  orchestrator:
    security_opt:
      - apparmor=unconfined

  local-db-agent:
    security_opt:
      - apparmor=unconfined

  gmail-agent:
    security_opt:
      - apparmor=unconfined

  drive-agent:
    security_opt:
      - apparmor=unconfined
