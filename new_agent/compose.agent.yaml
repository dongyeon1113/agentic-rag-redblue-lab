services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    restart: unless-stopped
    ports:
      - "${HOST_BIND:-127.0.0.1}:${OLLAMA_PORT:-19004}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "${OLLAMA_MODEL:-qwen3:8b}"]
    depends_on:
      ollama:
        condition: service_healthy

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.mock
    command: >-
      uvicorn agent_system.api.agent:app
      --host 0.0.0.0 --port 8000
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-1024}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
      MAX_TOOL_ITERATIONS: ${MAX_TOOL_ITERATIONS:-8}
      LOCAL_DB_AGENT_URL: http://local-db-agent:8001
      GMAIL_AGENT_URL: http://gmail-agent:8002
      DRIVE_AGENT_URL: http://drive-agent:8003
      MEMORY_DATA_DIR: /app/data/orchestrator
    volumes:
      - orchestrator-data:/app/data/orchestrator
    ports:
      - "${HOST_BIND:-127.0.0.1}:${ORCHESTRATOR_PORT:-19000}:8000"
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
      local-db-agent:
        condition: service_healthy
      gmail-agent:
        condition: service_healthy
      drive-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  local-db-agent:
    build:
      context: .
      dockerfile: Dockerfile.mock
    command: >-
      uvicorn agent_system.services.local_db.json_app:app
      --host 0.0.0.0 --port 8001
    environment:
      LOCAL_DB_DATA_DIR: /app/data/local_db
      KNOWLEDGE_SEED_FILE: /app/mock_data/local_db/nq_10000.json
      SECRET_SEED_FILE: /app/mock_data/local_db/secrets.json
    volumes:
      - local-db-data:/app/data/local_db
    ports:
      - "${HOST_BIND:-127.0.0.1}:${LOCAL_DB_AGENT_PORT:-19001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  gmail-agent:
    build:
      context: .
      dockerfile: Dockerfile.mock
    command: >-
      uvicorn agent_system.services.gmail.json_app:app
      --host 0.0.0.0 --port 8002
    environment:
      GMAIL_DATA_DIR: /app/data/gmail
      GMAIL_INBOX_SEED_FILE: /app/mock_data/gmail/inbox.json
      GMAIL_SENT_SEED_FILE: /app/mock_data/gmail/sent.json
    volumes:
      - gmail-data:/app/data/gmail
    ports:
      - "${HOST_BIND:-127.0.0.1}:${GMAIL_AGENT_PORT:-19002}:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  drive-agent:
    build:
      context: .
      dockerfile: Dockerfile.mock
    command: >-
      uvicorn agent_system.services.drive.json_app:app
      --host 0.0.0.0 --port 8003
    environment:
      DRIVE_DATA_DIR: /app/data/drive
      DRIVE_SEED_FILE: /app/mock_data/drive/items.json
    volumes:
      - drive-data:/app/data/drive
    ports:
      - "${HOST_BIND:-127.0.0.1}:${DRIVE_AGENT_PORT:-19003}:8003"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  ollama-models:
  orchestrator-data:
  local-db-data:
  gmail-data:
  drive-data:

