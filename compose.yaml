x-service-defaults: &service-defaults
  init: true
  build:
    context: .
  runtime: runc
  restart: unless-stopped
  networks:
    - agent-network
  environment:
    APP_VERSION: ${APP_VERSION:-0.1.0}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-healthcheck: &healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  ollama:
    init: true
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    restart: unless-stopped
    networks:
      - agent-network
    ports:
      - "${HOST_BIND:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ollama-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    runtime: runc
    restart: "no"
    networks:
      - agent-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - pull
      - qwen3:8b
    depends_on:
      ollama:
        condition: service_healthy

  ollama-llama32-3b-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    runtime: runc
    restart: "no"
    networks:
      - agent-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - pull
      - llama3.2:3b
    depends_on:
      ollama:
        condition: service_healthy

  ollama-llama32-1b-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    runtime: runc
    restart: "no"
    networks:
      - agent-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - pull
      - llama3.2:1b
    depends_on:
      ollama:
        condition: service_healthy

  ollama-embedding-model-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:6345fbc18bd73a1e16404be681dbc6fd291a027cab43ed541abe78c4c81051b0}
    runtime: runc
    restart: "no"
    networks:
      - agent-network
    environment:
      OLLAMA_HOST: http://ollama:11434
    command:
      - pull
      - ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy

  result-init:
    <<: *service-defaults
    user: root
    restart: "no"
    command:
      - sh
      - -c
      - chown app /app/result && chmod 0775 /app/result
    volumes:
      - ./result:/app/result

  agent-memory-init:
    <<: *service-defaults
    user: root
    restart: "no"
    command:
      - sh
      - -c
      - chown -R app:app /app/data/memory && chmod 0775 /app/data/memory
    volumes:
      - agent-memory:/app/data/memory

  mock-data-init:
    <<: *service-defaults
    user: root
    restart: "no"
    command:
      - sh
      - -c
      - chown -R app /app/mock_data && chmod 0775 /app/mock_data && chmod 0664 /app/mock_data/*.json
    volumes:
      - ./mock_data:/app/mock_data

  gmail-dummy-init:
    <<: *service-defaults
    user: root
    restart: "no"
    command:
      - sh
      - -c
      - chown app /app/datasets/sample/gmail_dummy.json && chmod 0664 /app/datasets/sample/gmail_dummy.json
    volumes:
      - ./datasets/sample:/app/datasets/sample

  orchestrator:
    <<: *service-defaults
    runtime: nvidia
    command:
      - uvicorn
      - services.orchestrator.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${ORCHESTRATOR_PORT:-8000}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-5}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
      OLLAMA_NUM_PREDICT: ${OLLAMA_NUM_PREDICT:-512}
      RAG_CONTEXT_LIMIT: ${RAG_CONTEXT_LIMIT:-6}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HOME: /app/data/huggingface
      PROMPT_GUARD_MODEL: ${PROMPT_GUARD_MODEL:-meta-llama/Prompt-Guard-86M}
      PROMPT_GUARD_DEVICE: ${PROMPT_GUARD_DEVICE:-cuda}
      PROMPT_GUARD_THRESHOLD: ${PROMPT_GUARD_THRESHOLD:-0.90}
      EXPERIMENT_RESULTS_DIR: /app/result
      EXPERIMENT_SCENARIOS_FILE: /app/datasets/experiments/nq_target_queries.json
      AGENT_MEMORY_FILE: /app/data/memory/memory.jsonl
      MEMORY_RECALL_LIMIT: ${MEMORY_RECALL_LIMIT:-3}
      # AGENT_POISON_CORPUS_HOST_FILE (host path, default the git-tracked
      # 100k corpus) is bind-mounted below to a fixed in-container path, so
      # switching to the full 2.68M corpus on a deployment that has it is a
      # one-variable change instead of a rebuild. See datasets/generated/
      # (nq_2681468.json isn't in git -- see .gitignore/.dockerignore).
      AGENT_POISON_CORPUS_FILE: /app/datasets/generated/nq_active_corpus.json
      LOCAL_DB_AGENT_URL: http://local-db-agent:8000
      GMAIL_AGENT_URL: http://gmail-agent:8000
      DRIVE_AGENT_URL: http://drive-agent:8000
    depends_on:
      agent-memory-init:
        condition: service_completed_successfully
      result-init:
        condition: service_completed_successfully
      mock-data-init:
        condition: service_completed_successfully
      gmail-dummy-init:
        condition: service_completed_successfully
      ollama-model-init:
        condition: service_completed_successfully
      ollama-llama32-3b-init:
        condition: service_completed_successfully
      ollama-llama32-1b-init:
        condition: service_completed_successfully
      local-db-agent:
        condition: service_healthy
      gmail-agent:
        condition: service_healthy
      drive-agent:
        condition: service_healthy
    volumes:
      - agent-memory:/app/data/memory
      - ./result:/app/result
      - ./mock_data:/app/mock_data
      - ./datasets/sample:/app/datasets/sample
      - huggingface-cache:/app/data/huggingface
      - ${AGENT_POISON_CORPUS_HOST_FILE:-./datasets/generated/nq_100000.json}:/app/datasets/generated/nq_active_corpus.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu


    healthcheck: *healthcheck

  local-db-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.local_db_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${LOCAL_DB_PORT:-8001}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # See AGENT_POISON_CORPUS_HOST_FILE above -- same bind-mount pattern so
      # the full corpus is a host-path/collection-name change, not a rebuild.
      DATA_FILE: /app/datasets/generated/nq_active_corpus.json
      SEARCH_BACKEND: chroma
      EMBEDDING_BACKEND: ollama
      OLLAMA_EMBEDDING_BASE_URL: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      CHROMA_INDEX_BATCH_SIZE: 500
      CHROMA_COLLECTION: ${CHROMA_COLLECTION:-local-db-nomic-v1}
      RAGPART_ENABLED: ${RAGPART_ENABLED:-false}
      RAGPART_FRAGMENTS: ${RAGPART_FRAGMENTS:-5}
      RAGPART_COMBINATION_SIZE: ${RAGPART_COMBINATION_SIZE:-3}
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      CHROMA_SYNC_TRUSTED_CORPUS: "true"
    volumes:
      - local-db-chroma:/app/data/chroma
      - ${AGENT_POISON_CORPUS_HOST_FILE:-./datasets/generated/nq_100000.json}:/app/datasets/generated/nq_active_corpus.json:ro
    depends_on:
      ollama-embedding-model-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck
      start_period: ${LOCAL_DB_HEALTH_START_PERIOD:-30m}

  gmail-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.gmail_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${GMAIL_PORT:-8002}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_FILE: ${GMAIL_DATA_FILE:-/app/datasets/sample/gmail_dummy.json}
      SEARCH_BACKEND: chroma
      RAGPART_ENABLED: ${RAGPART_ENABLED:-false}
      RAGPART_FRAGMENTS: ${RAGPART_FRAGMENTS:-5}
      RAGPART_COMBINATION_SIZE: ${RAGPART_COMBINATION_SIZE:-3}
      CHROMA_COLLECTION: gmail
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      GMAIL_SYNC_ENABLED: ${GMAIL_SYNC_ENABLED:-false}
      GMAIL_QUERY: ${GMAIL_QUERY:-in:anywhere}
      GMAIL_MAX_MESSAGES: ${GMAIL_MAX_MESSAGES:-100}
      GOOGLE_GMAIL_TOKEN_FILE: /run/secrets/google-gmail-token.json
    depends_on:
      gmail-dummy-init:
        condition: service_completed_successfully
    volumes:
      - ./datasets/sample:/app/datasets/sample
      - gmail-chroma:/app/data/chroma
    healthcheck: *healthcheck

  drive-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.drive_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "${HOST_BIND:-127.0.0.1}:${DRIVE_PORT:-8003}:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_FILE: ${DRIVE_DATA_FILE:-/app/datasets/sample/drive_dummy.json}
      SEARCH_BACKEND: chroma
      RAGPART_ENABLED: ${RAGPART_ENABLED:-false}
      RAGPART_FRAGMENTS: ${RAGPART_FRAGMENTS:-5}
      RAGPART_COMBINATION_SIZE: ${RAGPART_COMBINATION_SIZE:-3}
      CHROMA_COLLECTION: drive
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      DRIVE_SYNC_ENABLED: ${DRIVE_SYNC_ENABLED:-false}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google-service-account.json
    volumes:
      - drive-chroma:/app/data/chroma
    healthcheck: *healthcheck

networks:
  agent-network:
    driver: bridge

volumes:
  local-db-chroma:
  gmail-chroma:
  drive-chroma:
  ollama-models:
  agent-memory:
  huggingface-cache:
