x-service-defaults: &service-defaults
  build:
    context: .
  restart: unless-stopped
  networks:
    - agent-network
  environment:
    APP_VERSION: ${APP_VERSION:-0.1.0}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-healthcheck: &healthcheck
  test:
    - CMD
    - python
    - -c
    - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
  interval: 10s
  timeout: 3s
  retries: 5
  start_period: 5s

services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    restart: unless-stopped
    networks:
      - agent-network
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  orchestrator:
    <<: *service-defaults
    command:
      - uvicorn
      - services.orchestrator.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-5}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      OLLAMA_TEMPERATURE: ${OLLAMA_TEMPERATURE:-0}
      RAG_CONTEXT_LIMIT: ${RAG_CONTEXT_LIMIT:-6}
      LOCAL_DB_AGENT_URL: http://local-db-agent:8000
      GMAIL_AGENT_URL: http://gmail-agent:8000
      DRIVE_AGENT_URL: http://drive-agent:8000
    depends_on:
      ollama:
        condition: service_healthy
      local-db-agent:
        condition: service_healthy
      gmail-agent:
        condition: service_healthy
      drive-agent:
        condition: service_healthy
    healthcheck: *healthcheck

  local-db-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.local_db_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8001:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_FILE: /app/datasets/sample/nq_sample.json
      SEARCH_BACKEND: chroma
      CHROMA_COLLECTION: local-db
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
    volumes:
      - local-db-chroma:/app/data/chroma
    healthcheck: *healthcheck

  gmail-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.gmail_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8002:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_FILE: /app/datasets/sample/gmail_dummy.json
      SEARCH_BACKEND: chroma
      CHROMA_COLLECTION: gmail
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
    volumes:
      - gmail-chroma:/app/data/chroma
    healthcheck: *healthcheck

  drive-agent:
    <<: *service-defaults
    command:
      - uvicorn
      - services.drive_agent.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8003:8000"
    environment:
      APP_VERSION: ${APP_VERSION:-0.1.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATA_FILE: /app/datasets/sample/drive_dummy.json
      SEARCH_BACKEND: chroma
      CHROMA_COLLECTION: drive
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
    volumes:
      - drive-chroma:/app/data/chroma
    healthcheck: *healthcheck

networks:
  agent-network:
    driver: bridge

volumes:
  local-db-chroma:
  gmail-chroma:
  drive-chroma:
  ollama-models:
